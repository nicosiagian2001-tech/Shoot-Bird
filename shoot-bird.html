<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#8bc9ed">
<title>Shoot Bird</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,Arial,sans-serif;background:#8bc9ed;touch-action:manipulation}#game{display:block;width:100vw;height:100dvh;cursor:crosshair;touch-action: none}.hud{position:fixed;right:14px;top:12px;padding:10px 15px;border-radius:14px;background:#10233bdc;color:#fff;border:2px solid #ffffff70;box-shadow:0 5px 18px #10233b30;font-weight:800;letter-spacing:.4px;font-size:clamp(16px,3vw,22px);z-index:2}.hud span{color:#ffe46b}.top-left{position:fixed;top:12px;left:12px;z-index:2;background:#10233bdc;color:#fff;border:1px solid #ffffff70;padding:8px 12px;border-radius:12px;font-size:13px}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#09172a55;z-index:5}.card{width:min(420px,100%);text-align:center;color:white;padding:26px 22px;border-radius:24px;background:linear-gradient(145deg,#17385beF,#10233bf2);border:2px solid #ffffff70;box-shadow:0 20px 60px #06132655}.card h1{font-size:clamp(36px,9vw,54px);margin:0 0 5px;text-shadow:3px 4px #07182b}.card p{color:#d7eafa;line-height:1.5}.card button{font:inherit;font-weight:900;border:0;border-radius:14px;padding:13px 24px;background:#ffe46b;color:#1d2b39;cursor:pointer;box-shadow:0 5px 0 #c79d36}.card button:active{transform:translateY(3px);box-shadow:0 2px 0 #c79d36}.small{font-size:12px!important;color:#b6cfe2!important}.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="top-left">🎯 TAP BURUNG UNTUK MENEMBAK</div>
<div class="hud">🏆 SCORE: <span id="score">0</span></div>
<div class="overlay" id="start">
 <div class="card"><h1>🐦 SHOOT BIRD</h1><p>Tembak burung-burung yang terbang di langit pegunungan dan kumpulkan skor!</p><p>📱 Sentuh burung untuk menembak<br>💻 Klik burung dengan mouse</p><button id="startBtn">MULAI BERMAIN</button><p class="small">Setiap burung yang terkena tembakan menambah skor.</p></div>
</div>
<div class="overlay hidden" id="end">
 <div class="card"><h1>WAKTU HABIS!</h1><p>Skor akhir kamu:</p><h1 id="finalScore">0</h1><button id="againBtn">MAIN LAGI</button></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
let W=innerWidth,H=innerHeight,dpr=1,score=0,playing=false,startTime=0,timeLeft=45,lastFrame=0,birds=[],particles=[],clouds=[],shotFlash=0;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);makeClouds()}
function makeClouds(){clouds=Array.from({length:7},(_,i)=>({x:(i*197+50)%W,y:35+(i*47)%(Math.max(80,H*.36)),s:.55+(i%3)*.3,speed:5+i%4}))}
function rand(a,b){return a+Math.random()*(b-a)}
function bird(){let size=rand(20,34),fromLeft=Math.random()<.5;return{x:fromLeft?-size:W+size,y:rand(H*.16,H*.67),size,vx:(fromLeft?1:-1)*rand(75,155),vy:rand(-15,15),phase:rand(0,6.28),kind:Math.floor(Math.random()*6),hue:Math.floor(rand(0,360)),points:Math.random()<.15?5:Math.random()<.45?3:1}}
function spawn(){birds.push(bird())}
function mountainLayer(base,amp,color,seed){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,base);for(let x=0;x<=W+30;x+=30){let y=base-Math.abs(Math.sin((x+seed)*.006))*amp-Math.abs(Math.sin((x+seed)*.013))*amp*.48;ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.closePath();ctx.fill()}
function drawCloud(c){ctx.save();ctx.translate(c.x,c.y);ctx.scale(c.s,c.s);ctx.fillStyle='#ffffffb8';ctx.beginPath();ctx.arc(0,0,17,0,Math.PI*2);ctx.arc(19,-7,22,0,Math.PI*2);ctx.arc(42,0,16,0,Math.PI*2);ctx.arc(22,5,20,0,Math.PI*2);ctx.fill();ctx.restore()}
function background(dt){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#62b5e8');sky.addColorStop(.58,'#c8e8f5');sky.addColorStop(1,'#f5e4b8');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#fff0a8';ctx.beginPath();ctx.arc(W*.78,H*.17,Math.min(W,H)*.055,0,Math.PI*2);ctx.fill();
clouds.forEach(c=>{c.x+=c.speed*dt;if(c.x>W+70)c.x=-80;drawCloud(c)});
mountainLayer(H*.61,H*.25,'#9bbec7',120);mountainLayer(H*.69,H*.24,'#668f9d',40);mountainLayer(H*.79,H*.2,'#426c70',210);
ctx.fillStyle='#345b48';ctx.beginPath();ctx.moveTo(0,H*.84);for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,H*.81+Math.sin(x*.009)*H*.035+Math.sin(x*.021)*H*.018);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
// little pine silhouettes
for(let i=0;i<Math.ceil(W/55);i++){let x=i*55+12,y=H*.83+Math.sin(i*3)*H*.02;ctx.fillStyle=i%2?'#254b3f':'#1d423b';ctx.beginPath();ctx.moveTo(x,y-40);ctx.lineTo(x-15,y-7);ctx.lineTo(x-7,y-8);ctx.lineTo(x-19,y+10);ctx.lineTo(x+19,y+10);ctx.lineTo(x+7,y-8);ctx.lineTo(x+15,y-7);ctx.closePath();ctx.fill()}
}
function drawBird(b,t){ctx.save();ctx.translate(b.x,b.y+Math.sin(t*5+b.phase)*5);ctx.scale(b.vx<0?-1:1,1);let s=b.size;ctx.lineCap='round';ctx.lineJoin='round';
const palettes=[['#f7d35e','#db8d2c'],['#f1f5f9','#9caec1'],['#f36b55','#a92f3e'],['#55d6b0','#167d83'],['#9c7cf4','#5a43ad'],['#252d3a','#080e19']][b.kind];
ctx.fillStyle=palettes[0];ctx.beginPath();ctx.ellipse(0,0,s*.58,s*.36,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle=palettes[1];ctx.beginPath();ctx.ellipse(-s*.43,-s*.03,-s*.32,s*.18,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle=palettes[0];ctx.beginPath();ctx.moveTo(-s*.05,-s*.05);ctx.quadraticCurveTo(-s*.5,-s*(.35+Math.sin(t*12+b.phase)*.16),-s*.38,-s*.65);ctx.quadraticCurveTo(s*.05,-s*.52,s*.24,-s*.12);ctx.fill();
ctx.fillStyle=palettes[1];ctx.beginPath();ctx.moveTo(-s*.35,s*.02);ctx.lineTo(-s*.7,-s*.05);ctx.lineTo(-s*.44,s*.22);ctx.fill();
ctx.fillStyle='#ffb52e';ctx.beginPath();ctx.moveTo(s*.47,-s*.08);ctx.lineTo(s*.86,0);ctx.lineTo(s*.47,s*.08);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*.3,-s*.14,s*.105,0,Math.PI*2);ctx.fill();ctx.fillStyle='#15202b';ctx.beginPath();ctx.arc(s*.34,-s*.14,s*.05,0,Math.PI*2);ctx.fill();
if(b.points===5){ctx.strokeStyle='#ffe46b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,s*.82,0,Math.PI*2);ctx.stroke()}
ctx.restore()}
function drawCrosshair(x,y){ctx.save();ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.moveTo(x-16,y);ctx.lineTo(x-5,y);ctx.moveTo(x+5,y);ctx.lineTo(x+16,y);ctx.moveTo(x,y-16);ctx.lineTo(x,y-5);ctx.moveTo(x,y+5);ctx.lineTo(x,y+16);ctx.stroke();ctx.restore()}
function update(dt,t){if(!playing)return;timeLeft=Math.max(0,45-(t-startTime)/1000);if(Math.random()<dt*1.7&&birds.length<12)spawn();birds.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.phase+=dt*5});birds=birds.filter(b=>b.x>-80&&b.x<W+80);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);if(timeLeft<=0){playing=false;document.getElementById('finalScore').textContent=score;document.getElementById('end').classList.remove('hidden')}}
function render(t){let dt=Math.min((t-lastFrame)/1000||0,.04);lastFrame=t;background(dt);update(dt,t);birds.forEach(b=>drawBird(b,t/1000));particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/.5);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;if(playing){ctx.fillStyle='#10233b';ctx.font='bold 17px system-ui';ctx.textAlign='left';ctx.fillText('⏱ '+Math.ceil(timeLeft)+'s',14,70)}requestAnimationFrame(render)}
function shoot(e){if(!playing)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;let hit=-1;for(let i=birds.length-1;i>=0;i--){const b=birds[i];if(Math.hypot(x-b.x,y-(b.y+Math.sin(performance.now()/1000*5+b.phase)*5))<b.size*1.15){hit=i;break}}
if(hit>=0){const b=birds.splice(hit,1)[0];score+=b.points;scoreEl.textContent=score;for(let i=0;i<12;i++)particles.push({x:b.x,y:b.y,vx:rand(-100,100),vy:rand(-100,60),life:rand(.2,.6),color:['#ffe46b','#fff','#ff8b61','#75f2d0'][i%4]})}
else{particles.push({x,y,vx:0,vy:0,life:.15,color:'#fff'})}
}
document.getElementById('startBtn').onclick=()=>{score=0;scoreEl.textContent='0';birds=[];particles=[];startTime=performance.now();timeLeft=45;playing=true;document.getElementById('start').classList.add('hidden');for(let i=0;i<4;i++)spawn()};
document.getElementById('againBtn').onclick=()=>{document.getElementById('end').classList.add('hidden');document.getElementById('start').classList.remove('hidden')};
canvas.addEventListener('pointerdown',e=>{e.preventDefault();shoot(e)});addEventListener('resize',resize);resize();requestAnimationFrame(render);
})();
</script></body></html>
